# GitHub Actions CI workflow.
# Runs lint + tests on every push to main and every pull request.
# Docs: https://docs.github.com/en/actions

name: CI

# When does this workflow run?
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an old in-flight run if a new commit is pushed to the same branch/PR.
# Saves CI minutes and avoids confusing "stale" status checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    # Matrix: run the whole job once per Python version listed.
    # Catches version-specific issues early.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    # Make every uv command in this job use the matrix Python version.
    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      # 1. Check out the code.
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Install uv. Astral's official action handles caching too.
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # Cache key includes the lockfile so cache invalidates when deps change.
          cache-dependency-glob: "uv.lock"

      # 3. Install the requested Python version (uv handles this).
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 4. Install project + dev dependencies into an isolated venv.
      #    --frozen ensures CI uses exactly the versions in uv.lock — no surprise upgrades.
      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # 5. Lint with ruff.
      - name: Ruff lint
        run: uv run ruff check .

      # 6. Check formatting (doesn't modify files; fails if anything is unformatted).
      - name: Ruff format check
        run: uv run ruff format --check .

      # 7. Run the test suite.
      - name: Pytest
        run: uv run pytest

  # Build the wheel, install it into a clean environment with only the runtime
  # dependencies, and run what a new user runs first: the README quick start and
  # guide 08 on a CSV. The test job above uses the locked dev environment, so it
  # cannot see a missing runtime dependency.
  clean-install:
    name: Clean install smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Build the wheel and sdist
        run: uv build

      - name: Check the package metadata
        run: uvx twine check dist/*

      - name: Install the wheel into a clean environment
        run: |
          uv venv --python 3.12 /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl

      - name: README quick start
        run: /tmp/clean/bin/python tools/ci/readme_quickstart.py README.md

      - name: Guide 08 on a CSV
        run: |
          uv pip install --python /tmp/clean/bin/python nbconvert ipykernel
          /tmp/clean/bin/python -m ipykernel install --sys-prefix
          /tmp/clean/bin/python tools/ci/guide08_on_csv.py /tmp/guide08
