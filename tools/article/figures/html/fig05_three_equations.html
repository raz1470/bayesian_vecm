<!doctype html><html><head><meta charset=utf-8><style>
  :root {
    --bg: #fafaf8;
    --surface: #ffffff;
    --border: #e5e3de;
    --text: #1a1917;
    --muted: #6b6860;
    --accent: #2563eb;
    --accent-light: #eff6ff;
    --warn: #92400e;
    --warn-bg: #fffbeb;
    --code-bg: #f3f2ef;
    --green: #166534;
    --green-bg: #f0fdf4;
    --radius: 8px;
    --max-w: 860px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.7;
    font-size: 16px;
  }

  header {
    background: var(--text);
    color: #fff;
    padding: 3.5rem 2rem 3rem;
    text-align: center;
  }
  header h1 { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 0.5rem; line-height: 1.25; }
  header p { color: #cbd5e1; font-size: 1.05rem; max-width: 560px; margin: 0 auto; }

  nav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
    overflow-x: auto;
  }
  nav ul {
    display: flex;
    list-style: none;
    max-width: var(--max-w);
    margin: 0 auto;
    padding: 0 1rem;
  }
  nav ul li a {
    display: block;
    padding: 0.75rem 0.9rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  nav ul li a:hover, nav ul li a.on { color: var(--accent); border-bottom-color: var(--accent); }

  main { max-width: var(--max-w); margin: 0 auto; padding: 3rem 1.5rem 6rem; }

  section { margin-bottom: 4rem; padding-top: 1rem; scroll-margin-top: 3rem; }
  section h2 {
    font-size: 1.55rem;
    font-weight: 700;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 2px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    line-height: 1.3;
  }
  section h2 .num {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-light);
    padding: 0.1rem 0.45rem;
    border-radius: 4px;
    flex-shrink: 0;
  }
  section h3 { font-size: 1.1rem; font-weight: 600; margin: 1.75rem 0 0.5rem; color: var(--text); }
  p { margin-bottom: 1rem; color: #2d2c2a; }
  p:last-child { margin-bottom: 0; }
  ul.points { margin: 0.75rem 0 1rem 1.5rem; }
  ul.points li { margin-bottom: 0.45rem; color: #2d2c2a; }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-light);
    padding: 0.85rem 1.1rem;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin: 1.25rem 0;
    font-size: 0.95rem;
  }
  .callout.warn { border-color: #f59e0b; background: var(--warn-bg); }
  .callout strong { display: block; margin-bottom: 0.2rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--accent); }
  .callout.warn strong { color: var(--warn); }

  /* Figures */
  .diagram {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem 1.25rem 1rem;
    margin: 1.5rem 0;
  }
  .fig-title { font-size: 0.95rem; font-weight: 650; color: var(--text); margin-bottom: 0.1rem; }
  .fig-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.6rem; }
  .diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
  .diagram figcaption {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 0.75rem;
    line-height: 1.55;
  }
  .capline { display: block; }
  .capline + .capline { margin-top: 0.3rem; }
  .diagram figcaption strong { color: var(--text); font-weight: 600; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  @media (max-width: 640px) { .pair { grid-template-columns: 1fr; gap: 1.25rem; } }
  .panel-title { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 0.3rem; }

  /* System diagram */
  .system { display: flex; align-items: stretch; justify-content: center; gap: 0; flex-wrap: nowrap; }
  .sys-col { display: flex; flex-direction: column; justify-content: center; gap: 0.5rem; }
  .node {
    border-radius: 8px;
    padding: 0.55rem 0.8rem;
    font-size: 0.85rem;
    font-weight: 650;
    line-height: 1.3;
    text-align: center;
    border: 1.5px solid;
    background: #fff;
    min-width: 7.5rem;
  }
  .node small { display: block; font-weight: 400; font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  .node.drv { border-color: #d6d3cd; color: #4b4943; background: #f7f6f3; min-width: 9rem; padding: 0.35rem 0.7rem; font-weight: 600; font-size: 0.8rem; }
  .node.aw { border-color: #059669; color: #047857; background: #ecfdf5; }
  .node.co { border-color: #7c3aed; color: #6d28d9; background: #f5f3ff; }
  .node.sa { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }
  .arrow { align-self: center; color: #9ca3af; font-size: 1.3rem; padding: 0 0.5rem; }
  .sys-trend { display: flex; justify-content: flex-end; margin-top: 0.6rem; }
  .sys-col.macro { gap: 0.15rem; align-items: center; }
  .sys-col.macro .node { width: 100%; }
  .varrow { color: #9ca3af; font-size: 1.1rem; line-height: 1; text-align: center; }
  .bracket {
    border: 1.5px dashed #c7c4bd;
    border-top: none;
    border-radius: 0 0 8px 8px;
    height: 0.7rem;
  }
  .bracket-label { font-size: 0.75rem; color: var(--muted); text-align: center; margin-top: 0.2rem; }
  @media (max-width: 640px) {
    .system { flex-direction: column; align-items: stretch; }
    .sys-col { flex-direction: row; flex-wrap: wrap; justify-content: center; }
    .sys-col.macro { flex-direction: row; flex-wrap: nowrap; align-items: center; gap: 0.3rem; }
    .sys-col.macro .node { width: auto; min-width: 0; flex: 1; padding-left: 0.4rem; padding-right: 0.4rem; }
    .sys-col.macro .node.co { flex: 1.3; }
    .varrow { transform: rotate(-90deg); }
    .node.drv { min-width: 0; }
    .arrow { transform: rotate(90deg); padding: 0.2rem 0; }
  }

  /* Pipeline */
  .pipeline { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.75rem; }
  .stage { border-radius: 8px; border: 1.5px solid; padding: 0.7rem 0.8rem; font-size: 0.8rem; line-height: 1.45; position: relative; }
  .stage b { display: block; font-size: 0.88rem; margin-bottom: 0.3rem; }
  .stage span { display: block; }
  .stage.s1 { border-color: #f59e0b; background: #fffbeb; color: #78350f; }
  .stage.s2 { border-color: #2563eb; background: #eff6ff; color: #1e3a8a; }
  .stage.s3 { border-color: #059669; background: #ecfdf5; color: #065f46; }
  .stage.s4 { border-color: #7c3aed; background: #f5f3ff; color: #4c1d95; }
  .stage:not(:last-child)::after { content: "→"; position: absolute; right: -0.68rem; top: 50%; transform: translateY(-50%); color: #9ca3af; font-size: 1rem; }
  @media (max-width: 640px) {
    .pipeline { grid-template-columns: 1fr; }
    .stage:not(:last-child)::after { content: "↓"; right: auto; left: 50%; top: auto; bottom: -1.05rem; transform: none; }
  }

  /* Equations */
  .eq {
    background: var(--code-bg);
    border-radius: var(--radius);
    padding: 1rem 1.5rem;
    margin: 1.25rem 0;
    font-family: "Georgia", "Times New Roman", serif;
    font-size: 1.1rem;
    text-align: center;
    overflow-x: auto;
  }
  .eq .term { display: inline-block; text-align: center; margin: 0 0.3rem; vertical-align: middle; }
  .eq .term .symbol { font-size: 1.2rem; font-weight: 600; }
  .eq .term .label { display: block; font-size: 0.7rem; color: var(--muted); font-family: sans-serif; margin-top: 0.15rem; }
  .eq .plus { font-size: 1.3rem; vertical-align: middle; margin: 0 0.2rem; color: var(--muted); }
  .eq.lines { text-align: left; font-size: 1rem; line-height: 2; }
  .eq.lines .rl { font-family: sans-serif; font-size: 0.75rem; color: var(--muted); display: inline-block; width: 7.5rem; }

  details { border: 1px solid var(--border); border-radius: var(--radius); margin: 1.5rem 0; overflow: hidden; }
  details summary {
    padding: 0.75rem 1rem;
    cursor: pointer;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--muted);
    background: var(--code-bg);
    list-style: none;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    user-select: none;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▶"; font-size: 0.65rem; transition: transform 0.2s; }
  details[open] summary::before { transform: rotate(90deg); }
  details summary:hover { color: var(--text); }
  .hood-body { padding: 1.1rem 1.2rem; font-size: 0.92rem; border-top: 1px solid var(--border); }
  .hood-body p { color: var(--muted); margin-bottom: 0.75rem; }
  code {
    background: var(--code-bg);
    padding: 0.15rem 0.35rem;
    border-radius: 3px;
    font-size: 0.86em;
    font-family: "SF Mono", "Fira Mono", Menlo, monospace;
  }
  .math {
    font-family: "Georgia", serif;
    font-size: 1rem;
    background: var(--code-bg);
    padding: 0.6rem 1rem;
    border-radius: 4px;
    margin: 0.6rem 0 0.9rem;
    overflow-x: auto;
    color: var(--text);
  }

  .table-wrap { overflow-x: auto; margin: 1.25rem 0; }
  .param-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .param-table th {
    background: var(--code-bg);
    padding: 0.5rem 0.7rem;
    text-align: left;
    font-weight: 600;
    font-size: 0.76rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .param-table td { padding: 0.6rem 0.7rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  .param-table td.sym { font-family: "Georgia", serif; font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
  .param-table td.shape { white-space: nowrap; color: var(--muted); }
  .param-table td.brand { color: #1d4ed8; }
  .param-table tr:last-child td { border-bottom: none; }
  .tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 0.05rem 0.45rem; border-radius: 4px; }
  .tag.t { background: #eff6ff; color: #1d4ed8; }
  .tag.d { background: #f3f2ef; color: #4b4943; }


  pre { background: #1f2937; color: #e5e7eb; border-radius: var(--radius); padding: 0.9rem 1.1rem; overflow-x: auto; margin: 1.25rem 0; font-size: 0.82rem; line-height: 1.55; }
  pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
  .param-table small.rng { color: var(--muted); font-size: 0.78rem; white-space: nowrap; }
  .param-table tr.truth td { color: var(--muted); font-size: 0.82rem; padding-top: 0.2rem; }
  .param-table tr:has(+ tr.truth) td { border-bottom: none; padding-bottom: 0.2rem; }
  ol.steps { margin: 0.75rem 0 1rem 1.5rem; }
  ol.steps li { margin-bottom: 0.6rem; color: #2d2c2a; padding-left: 0.2rem; }

  footer { text-align: center; padding: 2rem 1.5rem; font-size: 0.82rem; color: var(--muted); border-top: 1px solid var(--border); }

  @media (max-width: 640px) {
    header { padding: 2.5rem 1rem 2rem; }
    header h1 { font-size: 1.6rem; }
    main { padding: 2rem 1rem 4rem; }
    section h2 { font-size: 1.3rem; }
    .diagram { padding: 1rem 0.75rem 0.85rem; }
    .eq { padding: 0.9rem 0.8rem; }
  }
</style><style>body{background:#fff;padding:20px;width:900px}

.sys .g1{color:#1d4ed8}.sys .g2{color:#047857}
.sys .rest{color:#6b6860}

.gaps .g1{color:#1d4ed8;font-weight:600}.gaps .g2{color:#047857;font-weight:600}</style></head><body><figure class="diagram" id="f3"><div class="fig-title" style="margin-bottom:0.6rem">One equation per series, fitted together</div>
<div class="sys">
<span class="l">Δ sales<sub>t</sub></span>= α<sub>11</sub>·<span class="g1">gap 1</span> + α<sub>12</sub>·<span class="g2">gap 2</span> <span class="rest">+ momentum + drivers + growth + shock</span><br>
<span class="l">Δ awareness<sub>t</sub></span>= α<sub>21</sub>·<span class="g1">gap 1</span> + α<sub>22</sub>·<span class="g2">gap 2</span> <span class="rest">+ momentum + drivers + growth + shock</span><br>
<span class="l">Δ consideration<sub>t</sub></span>= α<sub>31</sub>·<span class="g1">gap 1</span> + α<sub>32</sub>·<span class="g2">gap 2</span> <span class="rest">+ momentum + drivers + growth + shock</span>
</div>
<div class="gaps"><span class="g1">gap 1</span> = log sales − 1.27 × log consideration, last week&nbsp;&nbsp;&nbsp;&nbsp;<span class="g2">gap 2</span> = log awareness − 1.14 × log consideration, last week</div>
<figcaption>Both gaps appear in every equation. Each α says how strongly that series reacts to that gap. Momentum and drivers can differ by equation: brand spend can lift awareness without touching sales directly.</figcaption></figure></body></html>
